{% extends "base.html" %}{% block title %}Tour Packages{% endblock %}{% block content %}<div class="hero-mini"><h1>Tour Packages</h1></div><div class="container"><div class="grid">{% for p in packages %}<div class="card"><img src="{{p.image}}"><div class="card-body"><h2>{{p.title}}</h2><p class="muted">📍 {{p.location}} • {{p.days}}</p><p>{{p.description}}</p><h3>{{site.currency}}{{'%.0f'|format(p.price)}} <small class="muted">starting</small></h3><a class="btn" href="{{url_for('contact')}}">Get Custom Quote</a></div></div>{% endfor %}</div></div>{% endblock %}
