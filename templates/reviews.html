{% extends "base.html" %}{% block title %}Reviews{% endblock %}{% block content %}<div class="hero-mini"><h1>Customer Reviews</h1></div><div class="container"><div class="grid">{% for r in reviews %}<div class="card"><div class="card-body"><div class="stars">{{'★'*r.rating}}{{'☆'*(5-r.rating)}}</div><p>“{{r.comment}}”</p><b>{{r.name}}</b></div></div>{% endfor %}</div><br><form class="form" method="post" style="max-width:650px;margin:auto"><h2>Leave a Review</h2><div class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Rating</label><select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><div class="field full"><label>Comment</label><textarea name="comment" required></textarea></div><button class="btn">Submit</button></div></form></div>{% endblock %}
