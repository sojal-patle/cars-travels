{% extends "base.html" %}{% block title %}Availability{% endblock %}{% block content %}<div class="hero-mini"><h1>Vehicle Availability</h1></div><div class="container"><form class="form" style="margin-bottom:25px"><div class="row"><div class="field"><label>Start date</label><input type="date" name="start_date" value="{{start}}" required></div><div class="field"><label>End date</label><input type="date" name="end_date" value="{{end}}"></div><button class="btn" style="margin-top:22px">Check</button></div></form><div class="grid">{% for v in vehicles %}<div class="card"><img src="{{v.image}}"><div class="card-body"><h3>{{v.name}}</h3>{% if v.id in booked %}<div class="availability booked">🔴 Booked</div>{% else %}<div class="availability available">🟢 Available</div><br><a class="btn" href="{{url_for('book',vehicle_id=v.id)}}">Book</a>{% endif %}</div></div>{% endfor %}</div></div>{% endblock %}
